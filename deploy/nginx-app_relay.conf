server {
    listen 127.0.0.1:6969;
    server_name relay.aitradepulse.com;

    # Optional maintenance flag, consistent with other sites.
    set $maintenance_file /home/openclaw/.cloudflare-router/maintenance/relay.flag;
    if (-f $maintenance_file) {
        return 503;
    }

    location / {
        proxy_pass http://127.0.0.1:8301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /cf-health {
        return 200 '{"status":"ok","service":"relay","domain":"relay.aitradepulse.com"}';
        add_header Content-Type application/json;
    }

    error_page 404 /_cf-error/404.html;
    error_page 500 /_cf-error/500.html;
    error_page 502 /_cf-error/502.html;
    error_page 503 /_cf-error/503.html;
    location ^~ /_cf-error/ {
        internal;
        alias /home/openclaw/.cloudflare-router/error-pages/;
    }
}
